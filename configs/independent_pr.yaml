name: independent_pr_prediction
pipeline: single_target
algorithm: lightgbm
target: Pr
features:
  - IfcEntity
  - Storey
  - IsExternal
  - LoadBearing
  - GlobalX
  - GlobalY
  - GlobalZ
  - Bounding Box L
  - Bounding Box W
  - Bounding Box H
  - Area max
  - Area total
  - Volume
  - Ef
  - Ss
categorical_features:
  - IfcEntity
  - Storey
  - IsExternal
  - LoadBearing
  - Ef
  - Ss
test_size: 0.2
random_state: 42
model_params:
  n_estimators: 200
  learning_rate: 0.05
  num_leaves: 31
  subsample: 0.9
  colsample_bytree: 0.9
  reg_lambda: 1.0
  random_state: 42
